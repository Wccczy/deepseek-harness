# Minimal bash-envrc composition: the real app boot path with the project
# environment executor mounted in the shipped bash slot, plus the jobs runtime
# and the model-facing bash tool. Driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: fs
  name: '@deepseek-ai/dsh-fs-local'

- id: session-projections
  name: '@deepseek-ai/dsh-session-projection'

- id: working-directory
  name: '@deepseek-ai/dsh-working-directory'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: tool-executor-native
  name: '@deepseek-ai/dsh-tool-executor-native'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: bash
  name: '@deepseek-ai/dsh-bash-envrc'
  config:
    graceMs: 200
    envrc:
      timeoutMs: 5000

- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'

- id: tasks
  name: '@deepseek-ai/dsh-jobs-local'

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
